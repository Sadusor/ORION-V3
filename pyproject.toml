[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orion-v3"
version = "0.0.1"
description = "ORION V3 governed personal AI control-plane experiment"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/orion_v3"]